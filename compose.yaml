name: go-netprobe
services:
  demo:
    image: go-netprobe:local
    build: .
    entrypoint: ["/demo-target"]
    command: []
    environment:
      DEMO_ADDR: ":8085"
  netprobe:
    image: go-netprobe:local
    build: .
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:9092:9090"
    depends_on:
      - demo
    healthcheck:
      test: ["CMD", "/netprobe", "-healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10
